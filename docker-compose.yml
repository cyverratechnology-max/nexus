services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyverra
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: cyverra
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyverra -d cyverra"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: deployments/docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgres://cyverra:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/cyverra?sslmode=disable
      API_ADDR: :8080
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cyverra.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      MIGRATIONS_DIR: /app/migrations
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/meshcentral-data:/meshcentral-data:ro
volumes:
  postgres-data:
